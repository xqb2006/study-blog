      <path d="M614 593c105-26 252-28 382-2" fill="none" stroke="#070812" stroke-width="10" stroke-linecap="round" opacity=".86"/>
      <path d="M671 602c57 24 101 22 140-7" stroke="#79fff4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
      <path d="M870 596c52 31 98 30 137 0" stroke="#ff73ad" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <path d="M789 668c-11 42-5 70 27 86" fill="none" stroke="#6a2e5d" stroke-width="8" stroke-linecap="round"/>
