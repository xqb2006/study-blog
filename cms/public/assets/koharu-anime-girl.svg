<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Cyber anime operator poster</title>
  <desc id="desc">A premium cyber anime operator poster with neon hair, HUD rings and holographic interface lines.</desc>
  <defs>
    <radialGradient id="stage" cx="55%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4b1b5e"/>
      <stop offset="36%" stop-color="#14152d"/>
      <stop offset="74%" stop-color="#070812"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
    <linearGradient id="hairMain" x1="330" x2="1160" y1="130" y2="920">
      <stop offset="0%" stop-color="#0d1226"/>
      <stop offset="28%" stop-color="#311944"/>
      <stop offset="58%" stop-color="#ff2d6f"/>
      <stop offset="82%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#79fff4"/>
    </linearGradient>
    <linearGradient id="skin" x1="655" x2="940" y1="360" y2="760">
      <stop offset="0%" stop-color="#ffe9dc"/>
      <stop offset="42%" stop-color="#f7b7d0"/>
      <stop offset="100%" stop-color="#8e477b"/>
    </linearGradient>
    <linearGradient id="visor" x1="560" x2="1050" y1="0" y2="0">
