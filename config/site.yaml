    title: 友情链接
    subtitle: 欢迎交换友链！
    applyTitle: 申请友链
    applyDesc: 请在本页留言，格式如下
    exampleYaml: |
      - site: 你的博客名称 # 站点名称
        url: https://your-blog.com/ # 站点网址
        owner: 你的昵称 # 昵称
        desc: 站点简介 # 站点简介
        image: https://your-blog.com/avatar.jpg # 头像链接
        color: "#ffc0cb" # 主题色（可选）
